[project]
name = "satched"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [{ name = "mhead", email = "mtrxhead@protonmail.com" }]
requires-python = ">=3.10"
dependencies = [
    "temporalio>=1.34.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=6.0",
    "ruff>=0.8",
    "mypy>=1.13",
]

[tool.hatch.build.targets.wheel]
packages = ["src/satched"]

[tool.pytest.ini_options]
addopts = "-ra --cov=satched --cov-report=term-missing"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.10"
strict = true
mypy_path = "src"
files = ["src", "tests"]

[project]
name = "antiquity"
version = "0.1.0"
description = "A durable actor-tree orchestration framework built on top of Temporal."
readme = "README.md"
authors = [{ name = "mhead", email = "mtrxhead@protonmail.com" }]
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.14.0",
    "temporalio>=1.34.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=6.0",
    "ruff>=0.8",
    "ty>=0.0.89",
]

[tool.hatch.build.targets.wheel]
packages = ["src/antiquity"]

[tool.pytest.ini_options]
addopts = "-ra --cov=antiquity --cov-report=term-missing"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
